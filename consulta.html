<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consultar Estado</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="overlay">

<div class="right" style="max-width:600px; margin:auto; text-align:center;">

<h2>🔍 Consulta tu servicio</h2>

<form method="post">
<input type="text" name="telefono" placeholder="Ingresa tu número de WhatsApp" required>
<button type="submit">Consultar</button>
</form>

{% if resultados %}
<hr>

{% for r in resultados %}
<div style="background:#f5f5f5; margin:10px; padding:10px; border-radius:8px; color:black;">
<p><strong>ID:</strong> {{ r[0] }}</p>
<p><strong>Equipo:</strong> {{ r[5] }}</p>
<p><strong>Problema:</strong> {{ r[6] }}</p>
<p><strong>Estado:</strong> {{ r[7] }}</p>
</div>
{% endfor %}

{% endif %}

</div>

</div>
</body>
<div class="navbar">
<a href="/">🏠 Inicio</a>
<a href="/consulta">🔍 Consultar</a>
<a href="/admin">📊 Panel</a>
</div>

</html>
